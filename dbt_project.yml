name: 'bcda_connector'
version: '0.10.0'


profile: default

vars:
  demo_data_only: true
  claims_enabled: true

  # Input database and schema for BCDA source data
  input_database: tuva
  input_schema: raw_data

  bcda_coverage_file_prefix: '202301'


model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

